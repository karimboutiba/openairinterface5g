services:
    dpdk-init:
        image: docker.io/library/oai-dpdk-init:latest
        network_mode: host
        container_name: dpdk-init
        entrypoint: "/tmp/setup_sriov.sh"
        privileged: true
        devices:
            - /dev/vfio:/dev/vfio/
        volumes:
            - ./setup_sriov_metanoia.sh:/tmp/setup_sriov.sh
            - /lib/modules:/lib/modules
            - /usr/lib/modules:/usr/lib/modules
    oai-du:
        image: ${REGISTRY-oaisoftwarealliance/}oai-gnb-fhi72:${TAG:-develop}
        cap_add:
            - IPC_LOCK
            - SYS_NICE
        cap_drop:
            - ALL
        container_name: oai-gnb
        environment:
            TZ: Europe/Paris
            USE_ADDITIONAL_OPTIONS: --nsa --thread-pool 12,13,14,15 --log_config.global_log_options level,nocolor,utc_time
        devices:
            - /dev/vfio:/dev/vfio/
        volumes:
            - ../../conf_files/gnb-du.sa.band78.273prb.fhi72.4x4-metanoia-cobra.conf:/opt/oai-gnb/etc/gnb.conf
            - /dev/hugepages:/dev/hugepages
        # Please change these values based on your system
        cpuset: "6-15"
        network_mode: "host"
        depends_on:
           dpdk-init:
             condition: service_completed_successfully
        healthcheck:
           test: /bin/bash -c "/opt/oai-gnb/bin/check-prach-io.sh"
           start_period: 15s
           start_interval: 500ms
           interval: 5s
           timeout: 5s
           retries: 10
